<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <meta name="description" content="A minimal tic tac toe game. Play locally with a friend or against an unbeatable AI." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    html, body { background: #000; color: #fff; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: #fff; color: #000; }
    :focus-visible { outline: 1px solid #fff; outline-offset: 2px; }

    @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes mark-in { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    .animate-fade-in { animation: fade-in 200ms ease-out both; }
    .animate-mark-in { animation: mark-in 140ms cubic-bezier(0.22, 1, 0.36, 1) both; }
    .win-cell {
      background:
        linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%),
        #111;
      background-size: 200% 100%, 100% 100%;
      animation: shimmer 1.6s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-white flex flex-col">

  <!-- HEADER -->
  <header class="border-b border-[#333] sticky top-0 z-30 bg-black/80 backdrop-blur">
    <div class="max-w-5xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="#menu" onclick="showMenu();return false;" class="flex items-center gap-2.5 text-sm font-semibold tracking-tight hover:opacity-80 transition">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="4" x2="15" y2="20"/>
          <line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/>
        </svg>
        <span>Tic Tac Toe</span>
      </a>
      <button id="soundToggle" class="h-8 px-3 border border-[#333] text-xs font-medium hover:bg-[#111] hover:border-[#555] transition rounded-md">Sound on</button>
    </div>
  </header>

  <!-- MAIN -->
  <div class="flex-1 max-w-5xl w-full mx-auto px-6 py-14 sm:py-20 flex flex-col">

    <!-- MENU -->
    <div id="menu" class="animate-fade-in">
      <div class="max-w-2xl">
        <p class="text-xs tracking-[0.12em] uppercase text-[#888] font-medium mb-6">Choose your mode</p>
        <h1 class="text-5xl sm:text-6xl font-semibold tracking-[-0.03em] leading-[1.02]">
          Tic tac toe, <span class="text-[#888]">reduced to essentials.</span>
        </h1>
        <p class="text-[#888] mt-6 text-base leading-relaxed max-w-lg">
          Two modes. No accounts, no lobbies, no noise. Play on the same device with a friend, or take on an unbeatable minimax AI.
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-[#222] border border-[#222] mt-16 rounded-lg overflow-hidden">
        <button onclick="enterLocal()" class="group bg-black hover:bg-[#0a0a0a] p-8 text-left transition">
          <div class="flex items-center justify-between mb-6">
            <div class="w-10 h-10 border border-[#333] flex items-center justify-center rounded-md">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M14 19c0-2 2-3 3-3s3 1 3 3"/></svg>
            </div>
            <span class="text-xs font-mono text-[#666]">01</span>
          </div>
          <h3 class="text-lg font-semibold tracking-tight">Play with a friend</h3>
          <p class="text-sm text-[#888] mt-2 leading-relaxed">Same device, pass and play. Session score is kept until you reload.</p>
          <div class="mt-8 flex items-center gap-2 text-xs font-medium text-white opacity-70 group-hover:opacity-100 transition">Start local game →</div>
        </button>

        <button onclick="enterBot()" class="group bg-black hover:bg-[#0a0a0a] p-8 text-left transition">
          <div class="flex items-center justify-between mb-6">
            <div class="w-10 h-10 border border-[#333] flex items-center justify-center rounded-md">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 4v4"/><circle cx="9" cy="14" r="1" fill="currentColor"/><circle cx="15" cy="14" r="1" fill="currentColor"/></svg>
            </div>
            <span class="text-xs font-mono text-[#666]">02</span>
          </div>
          <h3 class="text-lg font-semibold tracking-tight">Play against the AI</h3>
          <p class="text-sm text-[#888] mt-2 leading-relaxed">Three difficulty tiers, minimax on unbeatable.</p>
          <div class="mt-8 flex items-center gap-2 text-xs font-medium text-white opacity-70 group-hover:opacity-100 transition">Start AI match →</div>
        </button>
      </div>
    </div>

    <!-- GAME -->
    <div id="game" class="hidden animate-fade-in max-w-md w-full mx-auto">
      <div class="flex items-center justify-between mb-8">
        <button onclick="showMenu()" class="text-xs font-medium text-[#888] hover:text-white transition flex items-center gap-1.5"><span>←</span> Back</button>
        <span id="modeLabel" class="text-[10px] font-mono uppercase tracking-wider text-[#666]"></span>
      </div>

      <!-- Local name inputs — ONLY in local mode -->
      <div id="localNames" class="hidden grid-cols-2 gap-3 mb-8 grid">
        <label class="block">
          <span class="text-[10px] font-mono uppercase tracking-wider text-[#666]">Player X</span>
          <input id="inX" type="text" maxlength="16" value="Player X" class="mt-1.5 w-full bg-black border border-[#333] rounded-md px-3 h-9 text-sm focus:border-white outline-none transition" />
        </label>
        <label class="block">
          <span class="text-[10px] font-mono uppercase tracking-wider text-[#666]">Player O</span>
          <input id="inO" type="text" maxlength="16" value="Player O" class="mt-1.5 w-full bg-black border border-[#333] rounded-md px-3 h-9 text-sm focus:border-white outline-none transition" />
        </label>
      </div>

      <!-- AI controls — ONLY in AI mode -->
      <div id="aiControls" class="hidden mb-8 space-y-4 border border-[#222] rounded-lg p-4">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <span class="text-[10px] font-mono uppercase tracking-wider text-[#666]">AI difficulty</span>
          <div id="diffGroup" class="inline-flex border border-[#333] rounded-md overflow-hidden">
            <button data-diff="easy" class="diff px-3 h-8 text-xs font-medium transition text-[#888] hover:text-white hover:bg-[#111]">easy</button>
            <button data-diff="medium" class="diff px-3 h-8 text-xs font-medium transition text-[#888] hover:text-white hover:bg-[#111]">medium</button>
            <button data-diff="unbeatable" class="diff px-3 h-8 text-xs font-medium transition bg-white text-black">unbeatable</button>
          </div>
        </div>
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <span class="text-[10px] font-mono uppercase tracking-wider text-[#666]">Your mark</span>
          <div id="symGroup" class="inline-flex border border-[#333] rounded-md overflow-hidden">
            <button data-sym="X" class="sym w-8 h-8 text-xs font-mono transition bg-white text-black">X</button>
            <button data-sym="O" class="sym w-8 h-8 text-xs font-mono transition text-[#888] hover:text-white hover:bg-[#111]">O</button>
          </div>
        </div>
      </div>

      <div class="text-center mb-5"><p id="status" class="text-sm font-medium tracking-tight"></p></div>

      <div id="board" class="grid grid-cols-3 gap-px bg-[#333] border border-[#333] rounded-lg overflow-hidden aspect-square"></div>

      <div id="scoreRow" class="mt-6 grid grid-cols-3 gap-px bg-[#222] border border-[#222] rounded-lg overflow-hidden"></div>

      <div class="mt-6 flex gap-2 justify-center">
        <button onclick="newRound()" class="h-9 px-4 bg-white text-black text-xs font-semibold rounded-md hover:bg-[#eaeaea] transition">New round</button>
        <button onclick="showMenu()" class="h-9 px-4 border border-[#333] text-xs font-medium rounded-md hover:bg-[#111] hover:border-[#555] transition">Change mode</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-[#333] mt-auto">
    <div class="max-w-5xl mx-auto px-6 py-6 flex items-center justify-center text-xs text-[#666]">
      <span>Made by <a href="#" class="text-white hover:text-[#eaeaea] underline underline-offset-4 decoration-[#444] hover:decoration-white transition font-medium">marbel</a></span>
    </div>
  </footer>

  <script>
    // ---------- STATE ----------
    let soundOn = localStorage.getItem('ttt_sound_html') !== '0';
    let mode = 'menu';
    let difficulty = localStorage.getItem('ttt_ai_difficulty_html') || 'unbeatable';
    let playerSymbol = localStorage.getItem('ttt_ai_symbol_html') || 'X';
    let board = Array(9).fill('');
    let turn = 'X';
    let winner = null;
    let winLine = [];
    let botThinking = false;
    let localScore = { x: 0, o: 0, d: 0 };
    let botScore = { w: 0, l: 0, d: 0 };
    const WIN = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    try { const saved = JSON.parse(localStorage.getItem('ttt_botscore_html') || 'null'); if (saved) botScore = saved; } catch {}

    // Restore diff & sym button states
    document.querySelectorAll('.diff').forEach(x => {
      x.className = 'diff px-3 h-8 text-xs font-medium transition ' + (x.dataset.diff === difficulty ? 'bg-white text-black' : 'text-[#888] hover:text-white hover:bg-[#111]');
    });
    document.querySelectorAll('.sym').forEach(x => {
      x.className = 'sym w-8 h-8 text-xs font-mono transition ' + (x.dataset.sym === playerSymbol ? 'bg-white text-black' : 'text-[#888] hover:text-white hover:bg-[#111]');
    });

    // ---------- SOUND ----------
    function beep(type) {
      if (!soundOn) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = new Ctx();
        if (type === 'click' || type === 'move') {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.connect(g); g.connect(ctx.destination);
          osc.type = type === 'click' ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(type === 'click' ? 600 : 450, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.1);
          g.gain.setValueAtTime(0.08, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'win') {
          [261.63,329.63,392,523.25].forEach((f, i) => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i*0.1);
            g.gain.setValueAtTime(0, ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + i*0.1 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i*0.1 + 0.15);
            osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.15);
          });
        } else if (type === 'lose') {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          osc.connect(g); g.connect(ctx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.4);
          g.gain.setValueAtTime(0.08, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(); osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'draw') {
          [0, 0.15].forEach(d => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(350, ctx.currentTime + d);
            g.gain.setValueAtTime(0.05, ctx.currentTime + d);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + d + 0.1);
            osc.start(ctx.currentTime + d); osc.stop(ctx.currentTime + d + 0.1);
          });
        }
      } catch {}
    }

    document.getElementById('soundToggle').addEventListener('click', function() {
      soundOn = !soundOn;
      localStorage.setItem('ttt_sound_html', soundOn ? '1' : '0');
      this.textContent = soundOn ? 'Sound on' : 'Sound off';
      if (soundOn) beep('click');
    });
    document.getElementById('soundToggle').textContent = soundOn ? 'Sound on' : 'Sound off';

    // ---------- CONTROLS ----------
    document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => {
      beep('click');
      difficulty = b.dataset.diff;
      localStorage.setItem('ttt_ai_difficulty_html', difficulty);
      document.querySelectorAll('.diff').forEach(x => {
        x.className = 'diff px-3 h-8 text-xs font-medium transition ' + (x.dataset.diff === difficulty ? 'bg-white text-black' : 'text-[#888] hover:text-white hover:bg-[#111]');
      });
      document.getElementById('modeLabel').textContent = 'AI · ' + difficulty;
    }));
    document.querySelectorAll('.sym').forEach(b => b.addEventListener('click', () => {
      beep('click');
      playerSymbol = b.dataset.sym;
      localStorage.setItem('ttt_ai_symbol_html', playerSymbol);
      document.querySelectorAll('.sym').forEach(x => {
        x.className = 'sym w-8 h-8 text-xs font-mono transition ' + (x.dataset.sym === playerSymbol ? 'bg-white text-black' : 'text-[#888] hover:text-white hover:bg-[#111]');
      });
      resetBoard();
      if (playerSymbol === 'O') setTimeout(botTurn, 350);
    }));

    // ---------- GAME LOGIC ----------
    function checkWin(b) {
      for (const [a,c,d] of WIN) if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a,c,d] };
      if (b.every(x => x !== '')) return { winner: 'draw' };
      return { winner: null };
    }
    function minimax(b, depth, isMax, botSym, playerSym) {
      const r = checkWin(b);
      if (r.winner === botSym) return 10 - depth;
      if (r.winner === playerSym) return depth - 10;
      if (r.winner === 'draw') return 0;
      if (isMax) { let best = -1000; for (let i = 0; i < 9; i++) if (b[i] === '') { b[i] = botSym; best = Math.max(best, minimax(b, depth+1, false, botSym, playerSym)); b[i] = ''; } return best; }
      let best = 1000; for (let i = 0; i < 9; i++) if (b[i] === '') { b[i] = playerSym; best = Math.min(best, minimax(b, depth+1, true, botSym, playerSym)); b[i] = ''; } return best;
    }
    function bestMove(b, botSym, playerSym) {
      let bv = -1000, bm = -1;
      for (let i = 0; i < 9; i++) if (b[i] === '') { b[i] = botSym; const v = minimax(b, 0, false, botSym, playerSym); b[i] = ''; if (v > bv) { bv = v; bm = i; } }
      if (bm === -1) { const a = b.map((c,i)=>c===''?i:-1).filter(i=>i!==-1); return a[Math.floor(Math.random()*a.length)]; }
      return bm;
    }
    function getBotMove(b) {
      const avail = b.map((c,i)=>c===''?i:-1).filter(i=>i!==-1);
      if (!avail.length) return -1;
      const botSym = playerSymbol === 'X' ? 'O' : 'X';
      if (difficulty === 'easy') return avail[Math.floor(Math.random()*avail.length)];
      if (difficulty === 'medium') return Math.random() < 0.5 ? bestMove(b, botSym, playerSymbol) : avail[Math.floor(Math.random()*avail.length)];
      return bestMove(b, botSym, playerSymbol);
    }

    // ---------- NAV ----------
    function show(id) { ['menu','game'].forEach(x => document.getElementById(x).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function showMenu() { beep('click'); mode = 'menu'; resetBoard(); show('menu'); }
    function enterLocal() {
      beep('click'); mode = 'local'; resetBoard(); show('game');
      document.getElementById('modeLabel').textContent = 'Local · pass and play';
      document.getElementById('localNames').classList.remove('hidden');
      document.getElementById('aiControls').classList.add('hidden');
      render();
    }
    function enterBot() {
      beep('click'); mode = 'bot'; resetBoard(); show('game');
      document.getElementById('modeLabel').textContent = 'AI · ' + difficulty;
      document.getElementById('localNames').classList.add('hidden');
      document.getElementById('aiControls').classList.remove('hidden');
      render();
      if (playerSymbol === 'O') setTimeout(botTurn, 350);
    }
    function resetBoard() { board = Array(9).fill(''); turn = 'X'; winner = null; winLine = []; botThinking = false; }
    function newRound() {
      beep('click'); resetBoard(); render();
      if (mode === 'bot' && playerSymbol === 'O') setTimeout(botTurn, 350);
    }

    // ---------- MOVES ----------
    function onCell(i) {
      if (winner || board[i] !== '') return;
      if (mode === 'local') {
        board[i] = turn; beep('move');
        const r = checkWin(board);
        if (r.winner) { winner = r.winner; winLine = r.line || []; endLocal(); }
        else { turn = turn === 'X' ? 'O' : 'X'; }
        render(); return;
      }
      if (mode === 'bot') {
        if (botThinking || turn !== playerSymbol) return;
        board[i] = playerSymbol; beep('move');
        const r = checkWin(board);
        if (r.winner) { winner = r.winner; winLine = r.line || []; endBot(); render(); return; }
        turn = playerSymbol === 'X' ? 'O' : 'X';
        render();
        botTurn();
      }
    }
    function botTurn() {
      if (winner) return;
      botThinking = true; render();
      const delay = difficulty === 'easy' ? 320 : difficulty === 'medium' ? 520 : 780;
      setTimeout(() => {
        if (winner || mode !== 'bot') { botThinking = false; render(); return; }
        const move = getBotMove(board.slice());
        if (move !== -1) {
          const botSym = playerSymbol === 'X' ? 'O' : 'X';
          board[move] = botSym; beep('move');
          const r = checkWin(board);
          if (r.winner) { winner = r.winner; winLine = r.line || []; endBot(); }
          else { turn = playerSymbol; }
        }
        botThinking = false;
        render();
      }, delay);
    }
    function endLocal() {
      if (winner === 'draw') { beep('draw'); localScore.d++; }
      else { beep('win'); if (winner === 'X') localScore.x++; else localScore.o++; }
    }
    function endBot() {
      if (winner === 'draw') { beep('draw'); botScore.d++; }
      else if (winner === playerSymbol) { beep('win'); botScore.w++; }
      else { beep('lose'); botScore.l++; }
      localStorage.setItem('ttt_botscore_html', JSON.stringify(botScore));
    }

    // ---------- RENDER ----------
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function render() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board.forEach((cell, i) => {
        const isWin = winLine.includes(i);
        const clickable = !winner && cell === '' && !(mode === 'bot' && (turn !== playerSymbol || botThinking));
        const btn = document.createElement('button');
        btn.className = 'relative aspect-square flex items-center justify-center text-5xl font-mono transition-colors ' + (isWin ? 'win-cell' : 'bg-black') + (clickable ? ' hover:bg-[#0f0f0f] cursor-pointer' : ' cursor-default');
        btn.disabled = !clickable;
        if (cell) btn.innerHTML = '<span class="animate-mark-in text-white">' + cell + '</span>';
        btn.onclick = () => onCell(i);
        boardEl.appendChild(btn);
      });

      const nameX = (document.getElementById('inX')?.value || 'Player X').trim() || 'Player X';
      const nameO = (document.getElementById('inO')?.value || 'Player O').trim() || 'Player O';
      let s = '';
      if (winner === 'draw') s = 'Draw';
      else if (winner && mode === 'local') s = (winner === 'X' ? nameX : nameO) + ' wins';
      else if (winner && mode === 'bot') s = winner === playerSymbol ? 'You win' : 'AI wins';
      else if (mode === 'bot' && botThinking) s = 'AI thinking…';
      else if (mode === 'bot') s = turn === playerSymbol ? 'Your turn — ' + playerSymbol : 'AI turn';
      else s = (turn === 'X' ? nameX : nameO) + ' — ' + turn;
      document.getElementById('status').textContent = s;

      const row = document.getElementById('scoreRow');
      if (mode === 'local') {
        row.innerHTML =
          '<div class="bg-black p-3 text-center"><p class="text-[10px] font-mono uppercase tracking-wider text-[#666] truncate">' + esc(nameX) + ' · X</p><p class="text-lg font-mono mt-0.5">' + localScore.x + '</p></div>' +
          '<div class="bg-black p-3 text-center"><p class="text-[10px] font-mono uppercase tracking-wider text-[#666]">Draws</p><p class="text-lg font-mono mt-0.5">' + localScore.d + '</p></div>' +
          '<div class="bg-black p-3 text-center"><p class="text-[10px] font-mono uppercase tracking-wider text-[#666] truncate">' + esc(nameO) + ' · O</p><p class="text-lg font-mono mt-0.5">' + localScore.o + '</p></div>';
      } else {
        row.innerHTML =
          '<div class="bg-black p-3 text-center"><p class="text-[10px] font-mono uppercase tracking-wider text-[#666]">You</p><p class="text-lg font-mono mt-0.5">' + botScore.w + '</p></div>' +
          '<div class="bg-black p-3 text-center"><p class="text-[10px] font-mono uppercase tracking-wider text-[#666]">Draws</p><p class="text-lg font-mono mt-0.5">' + botScore.d + '</p></div>' +
          '<div class="bg-black p-3 text-center"><p class="text-[10px] font-mono uppercase tracking-wider text-[#666]">AI</p><p class="text-lg font-mono mt-0.5">' + botScore.l + '</p></div>';
      }
    }
  </script>
</body>
</html>
